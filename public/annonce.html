<script src="js/api.js"></script>
<script>
async function loadListing() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const contentEl = document.getElementById('content');

  if (!id) {
    contentEl.innerHTML = '<div class="empty">Annonce introuvable.</div>';
    return;
  }

  try {
const data = await apiFetch('/listings/' + id);
    const l = data.listing;
    const images = l.images && l.images.length ? l.images : [];
    const favIds = await getFavoriteIds();
    const favorited = favIds.has(l.id);

    contentEl.innerHTML = `
      <div class="panel" style="max-width:640px; margin:0 auto;">
        ${images.length ? `
          <div class="carousel" id="carousel" style="margin-bottom:22px;">
            <div class="carousel-track" id="carousel-track">
              ${images.map((src, i) => `<img src="${src}" alt="${l.title} — photo ${i + 1}"${i === 0 ? '' : ' loading="lazy"'}>`).join('')}
            </div>
            ${images.length > 1 ? `
              <button class="carousel-arrow prev" id="carousel-prev">‹</button>
              <button class="carousel-arrow next" id="carousel-next">›</button>
              <div class="carousel-dots" id="carousel-dots">
                ${images.map((_, i) => `<span class="${i === 0 ? 'active' : ''}"></span>`).join('')}
              </div>
            ` : ''}
          </div>
        ` : ''}
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span class="cat-pill">${l.category}</span>
          ${isNew(l.createdAt) ? '<span class="badge badge-new">Nouveau</span>' : ''}
        </div>
        <h2 style="margin:16px 0 6px;">${l.title}</h2>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px;">
          <div class="price mono" style="font-size:1.5rem;">${formatPrice(l.price)}</div>
          <button class="btn btn-outline btn-sm" id="fav-btn">${favorited ? '♥ Enregistré' : '♡ Enregistrer'}</button>
        </div>
        <div class="views-line" style="margin-bottom:16px;">${l.views || 0} vue${(l.views || 0) > 1 ? 's' : ''}</div>
        <p style="color:var(--ink-muted); margin-bottom:20px;">${l.description}</p>
        <div class="meta" style="margin-bottom:10px;">
          ${l.city} · publié le ${formatDate(l.createdAt)}
        </div>
        ${l.owner ? `
          <a href="/annonceur?id=${l.owner.id}" class="panel" style="display:flex; align-items:center;
             justify-content:space-between; gap:12px; margin-bottom:22px; padding:16px 20px;">
            <div>
              <div style="font-weight:600; margin-bottom:4px;">${l.owner.name}</div>
              ${renderStars(l.owner.ratingAvg, l.owner.ratingCount)}
            </div>
            <span class="btn btn-outline btn-sm">Voir le profil →</span>
          </a>
        ` : ''}
        <a class="btn btn-whatsapp btn-block" id="wa-btn" href="${waLink(l.phone, l.title)}" target="_blank" rel="noopener">
  Contacter sur WhatsApp
</a>
      </div>
    `;

    const favBtn = document.getElementById('fav-btn');
    favBtn.addEventListener('click', async () => {
      if (!getToken()) { window.location.href = '/connexion'; return; }
      try {
        const nowFavorited = await toggleFavorite(l.id);
        favBtn.textContent = nowFavorited ? '♥ Enregistré' : '♡ Enregistrer';
      } catch (err) {
        showToast(err.message, true);
      }
    });
    document.getElementById('wa-btn').addEventListener('click', () => {
  apiFetch('/listings/' + l.id + '/contact-click', { method: 'POST' }).catch(() => {});
});

    if (images.length > 1) initCarousel(images.length);
  } catch (err) {
    contentEl.innerHTML = '<div class="empty">Cette annonce n\'existe plus ou a été retirée.</div>';
  }
}

function initCarousel(count) {
  const track = document.getElementById('carousel-track');
  const dots = document.querySelectorAll('#carousel-dots span');
  let index = 0;
  let startX = null;

  function goTo(i) {
    index = (i + count) % count;
    track.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((d, di) => d.classList.toggle('active', di === index));
  }

  document.getElementById('carousel-prev').addEventListener('click', () => goTo(index - 1));
  document.getElementById('carousel-next').addEventListener('click', () => goTo(index + 1));

  const carousel = document.getElementById('carousel');
  carousel.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
  carousel.addEventListener('touchend', (e) => {
    if (startX === null) return;
    const delta = e.changedTouches[0].clientX - startX;
    if (Math.abs(delta) > 40) goTo(delta < 0 ? index + 1 : index - 1);
    startX = null;
  });
}

loadListing();
</script>
