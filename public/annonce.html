<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annonce — Yaka Marché</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="topbar">
  <div class="inner">
    <a href="/" class="brand"><div class="brand-mark">Y</div><span class="brand-text">Yaka Marché</span></a>
    <div class="nav-links">
      <a href="/">Accueil</a>
      <a href="/annonces">Annonces</a>
      <a href="/publier">Publier</a>
      <a href="/tableau-de-bord" data-auth="user">Tableau de bord</a>
      <a href="/admin" data-auth="admin" class="hidden">Admin</a>
    </div>
    <div class="nav-actions">
      <a href="/connexion" class="btn btn-outline btn-sm" data-auth="guest">Connexion</a>
      <a href="/inscription" class="btn btn-primary btn-sm" data-auth="guest">Inscription</a>
      <a href="/tableau-de-bord" class="btn btn-outline btn-sm hidden" data-auth="user">Mon compte</a>
      <a href="#" class="btn btn-leather btn-sm hidden" data-auth="user" data-action="logout">Déconnexion</a>
    </div>
  </div>
</nav>

<section>
  <div class="container" id="content">
    <div class="loading">Chargement de l'annonce...</div>
  </div>
</section>

<footer>
  <div class="container inner">
    <div>© 2026 Yaka Marché — marketplace locale, Congo.</div>
    <div class="credit">Un produit WORLDIFYAI </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script>
async function loadListing() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const contentEl = document.getElementById('content');

  if (!id) {
    contentEl.innerHTML = '<div class="empty">Annonce introuvable.</div>';
    return;
  }

  try {
    const data = await apiFetch('/listings/' + id);
    const l = data.listing;
    contentEl.innerHTML = `
      <div class="panel" style="max-width:640px; margin:0 auto;">
        <span class="cat-pill">${l.category}</span>
        <h2 style="margin:16px 0 6px;">${l.title}</h2>
        <div class="price mono" style="font-size:1.5rem; margin-bottom:18px;">${formatPrice(l.price)}</div>
        <p style="color:var(--ink-muted); margin-bottom:20px;">${l.description}</p>
        <div class="meta" style="margin-bottom:24px;">
          ${l.city} · publié le ${formatDate(l.createdAt)}
          ${l.owner && l.owner.name ? ' · par ' + l.owner.name : ''}
        </div>
        <a class="btn btn-whatsapp btn-block" href="${waLink(l.phone, l.title)}" target="_blank" rel="noopener">
          Contacter sur WhatsApp
        </a>
      </div>
    `;
  } catch (err) {
    contentEl.innerHTML = '<div class="empty">Cette annonce n\'existe plus ou a été retirée.</div>';
  }
}

loadListing();
</script>
</body>
</html>
